<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>Install in the Claude app: plus button, Plugins, Add marketplace, Add plugin</title>
  <rect width="760" height="150" rx="14" fill="#1f1e1d"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8986"/>
    </marker>
  </defs>
  <g fill="#8b8986" font-size="12" letter-spacing="0.5">
    <text x="30" y="34">1</text><text x="206" y="34">2</text><text x="372" y="34">3</text><text x="632" y="34">4</text>
  </g>

  <rect x="30" y="46" width="140" height="64" rx="10" fill="#2a2928"/>
