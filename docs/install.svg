  <text x="84" y="76" fill="#ededec">next to the</text>
  <text x="84" y="94" fill="#ededec">prompt box</text>

  <line x1="174" y1="78" x2="200" y2="78" stroke="#8b8986" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="206" y="46" width="140" height="64" rx="10" fill="#2a2928"/>
  <text x="276" y="83" fill="#ededec" text-anchor="middle" font-weight="600">Plugins</text>

  <line x1="350" y1="78" x2="366" y2="78" stroke="#8b8986" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="372" y="46" width="230" height="64" rx="10" fill="#2a2928"/>
  <text x="487" y="72" fill="#ededec" text-anchor="middle" font-weight="600">Add marketplace</text>
  <rect x="382" y="82" width="210" height="20" rx="4" fill="#1f1e1d"/>
  <text x="487" y="96" fill="#d97757" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, monospace">AkmaljonAbdirakhimov/hey-claude</text>

  <line x1="606" y1="78" x2="626" y2="78" stroke="#8b8986" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="632" y="46" width="100" height="64" rx="10" fill="#2a2928"/>
  <text x="682" y="83" fill="#ededec" text-anchor="middle" font-weight="600">Add plugin</text>

  <text x="30" y="135" fill="#8b8986" font-size="13">Then click Allow when macOS asks for Microphone and Speech Recognition.</text>
